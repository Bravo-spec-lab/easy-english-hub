<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula Virtual | EASY English Hub</title>
  <meta name="description"
    content="Aula virtual interactiva de Inglés Básico: lectura asistida por voz nativa, ficha de práctica, autoevaluaciones, diapositivas, recursos e infografías por día.">
  <meta name="author" content="Bravo • Computación e Informática">

  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232563eb'/><text x='50' y='65' font-size='50' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'>E</text></svg>">

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Contenido de la vista Aula Virtual (el layout común lo envuelve js/layout.js) -->
  <template id="pageTemplate">
    <section class="view-section active" id="view_classroom">
      <div class="classroom-layout">

        <!-- Left Syllabus Navigator (Tree inside Classroom) -->
        <aside class="syllabus-card" id="syllabusCard">
          <h3 class="syllabus-title">
            <i class="fa-solid fa-list-ol" style="color: var(--primary-500);"></i> Temario del Curso
          </h3>
          <div class="syllabus-accordion" id="syllabusAccordion">
            <!-- Populated dynamically by js/paginas/aula.js -->
          </div>
        </aside>

        <!-- Right Main Stage Classroom Workspace -->
        <div class="classroom-stage-card" id="classroomStageCard">

          <!-- Stage Header -->
          <div class="stage-header">
            <div class="stage-header-info">
              <div class="stage-badges-row">
                <span class="stage-week-badge" id="stageWeekBadge">Semana 1</span>
                <span class="stage-focus-tag" id="stageFocusTag">
                  <i class="fa-solid fa-bullseye"></i> Enfoque del día
                </span>
              </div>
              <h2 class="stage-lesson-title" id="stageLessonTitle">Cargando Lección...</h2>
            </div>

            <div class="stage-header-actions">
              <button type="button" class="btn-complete-lesson" id="stageCompleteBtn">
                <i class="fa-regular fa-circle-check"></i> Marcar como Completada
              </button>
            </div>
          </div>

          <!-- Classroom Tabs Bar -->
          <nav class="classroom-tabs-bar" id="classroomTabsBar" aria-label="Contenidos de la clase">
            <button type="button" class="stage-tab-btn" data-tab="theory">
              <i class="fa-solid fa-graduation-cap"></i> 1. Teoría
            </button>
            <button type="button" class="stage-tab-btn" data-tab="reading">
              <i class="fa-solid fa-book-open"></i> 2. Lectura Asistida
            </button>
            <button type="button" class="stage-tab-btn" data-tab="worksheet">
              <i class="fa-solid fa-pen-ruler"></i> 3. Ficha Práctica
            </button>
            <button type="button" class="stage-tab-btn" data-tab="quiz">
              <i class="fa-solid fa-circle-question"></i> 4. Autoevaluación
            </button>
            <button type="button" class="stage-tab-btn" data-tab="challenge">
              <i class="fa-solid fa-stopwatch"></i> 5. Reto Cronometrado
            </button>
            <button type="button" class="stage-tab-btn" data-tab="slides">
              <i class="fa-solid fa-chalkboard-user"></i> 6. Diapositivas PPT
            </button>
            <button type="button" class="stage-tab-btn" data-tab="resources">
              <i class="fa-solid fa-globe"></i> 7. Recursos & Práctica
            </button>
            <button type="button" class="stage-tab-btn" data-tab="poster">
              <i class="fa-solid fa-image"></i> 8. Infografía
            </button>
          </nav>

          <!-- Tab Panel 0: Teoría -->
          <div class="stage-panel" id="stagePanel_theory">
            <div class="theory-container" id="theoryContainer">
              <!-- Populated dynamically by js/paginas/aula.js -->
            </div>
          </div>

          <!-- Tab Panel 1: Lectura Asistida con Voz -->
          <div class="stage-panel" id="stagePanel_reading">
            <!-- Audio Bar -->
            <div class="audio-player-bar" id="audioPlayerBar">
              <div class="audio-controls-left">
                <button type="button" class="btn-audio-play" id="audioPlayBtn">
                  <i class="fa-solid fa-play"></i> Escuchar Lectura
                </button>
                <button type="button" class="btn-audio-stop" id="audioStopBtn" title="Detener audio">
                  <i class="fa-solid fa-stop"></i> Detener
                </button>
                <label for="audioSpeedSelect" style="display:none;">Velocidad</label>
                <select id="audioSpeedSelect" class="audio-speed-select" title="Velocidad de reproducción">
                  <option value="0.8">0.8x (Lento)</option>
                  <option value="1.0" selected>1.0x (Normal)</option>
                  <option value="1.2">1.2x (Rápido)</option>
                </select>
              </div>
              <div class="audio-status-label" id="audioStatusLabel">
                <i class="fa-solid fa-circle-pause" style="color: var(--text-muted)"></i> Audio listo
              </div>
            </div>

            <!-- Dual Layout: Reading Text + Grammar & Vocabulary -->
            <div class="reading-stage-grid">
              <div class="reading-main-column">
                <div class="reading-text-card" id="readingTextCard">
                  <!-- Populated dynamically -->
                </div>

                <div class="grammar-card" id="grammarCard">
                  <div class="grammar-card-header">
                    <i class="fa-solid fa-code"></i> Grammar Focus (Estructura Gramatical)
                  </div>
                  <div class="grammar-card-body" id="grammarCardBody">
                    <!-- Populated dynamically -->
                  </div>
                </div>
              </div>

              <aside class="stage-side-column">
                <div class="vocab-widget-card" id="vocabWidgetCard">
                  <h4 id="vocabWidgetTitle"><i class="fa-solid fa-lightbulb"></i> Vocabulario Clave</h4>
                  <div class="vocab-chips-wrap" id="vocabChipsWrap">
                    <!-- Populated dynamically -->
                  </div>
                </div>

                <div class="after-reading-card" id="afterReadingCard">
                  <h4><i class="fa-solid fa-list-check"></i> Actividades Post-Lectura</h4>
                  <ul class="after-reading-list" id="afterReadingList">
                    <!-- Populated dynamically -->
                  </ul>
                </div>
              </aside>
            </div>
          </div>

          <!-- Tab Panel 2: Ficha Práctica Interactiva -->
          <div class="stage-panel" id="stagePanel_worksheet">
            <div class="worksheet-container">
              <div id="worksheetSectionsWrap">
                <!-- Populated dynamically -->
              </div>
              <div style="display: flex; justify-content: flex-end; padding-top: 1rem;">
                <button type="button" class="btn-primary-action" id="saveWorksheetBtn">
                  <i class="fa-solid fa-floppy-disk"></i> <span>Guardar Mis Respuestas</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Tab Panel 3: Autoevaluación (Quiz) -->
          <div class="stage-panel" id="stagePanel_quiz">
            <div class="quiz-wrapper">
              <div class="quiz-score-banner">
                <div class="quiz-score-text">
                  <h3>Autoevaluación Oficial del Día</h3>
                  <p>Responde las 5 preguntas y obtén retroalimentación inmediata con explicación.</p>
                </div>
                <div class="quiz-score-pill" id="quizScorePill">0 / 5</div>
              </div>

              <div id="quizQuestionsWrap" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <!-- Populated dynamically -->
              </div>

              <div class="master-answer-card">
                <div class="master-answer-header" id="masterAnswerHeader">
                  <h4><i class="fa-solid fa-key"></i> Ver Solucionario y Hoja de Respuestas</h4>
                  <i class="fa-solid fa-chevron-down" id="masterAnswerIcon"></i>
                </div>
                <div class="master-answer-body" id="masterAnswerBody">
                  <!-- Populated dynamically -->
                </div>
              </div>
            </div>
          </div>

          <!-- Tab Panel 4.5: Reto Cronometrado -->
          <div class="stage-panel" id="stagePanel_challenge">
            <div class="theory-container" id="challengeContainer">
              <!-- Populated dynamically by js/paginas/aula.js -->
            </div>
          </div>

          <!-- Tab Panel 4: Diapositivas PPT Interactivas en Pantalla -->
          <div class="stage-panel" id="stagePanel_slides">
            <div class="slides-viewer-card">
              <div class="slides-toolbar">
                <div style="display: flex; align-items: center; gap: 0.8rem;">
                  <h4 style="font-family: var(--font-heading); font-size: 1.15rem; font-weight: 700;">
                    <i class="fa-solid fa-chalkboard-user"
                      style="color: var(--primary-500); margin-right: 0.35rem;"></i> Diapositivas Oficiales de la
                    Semana
                  </h4>
                  <span class="slide-counter-badge" id="slideCounterBadge">Diapositiva 1 de 8</span>
                </div>

                <div class="slide-controls">
                  <button type="button" class="btn-stage-nav" id="slidePrevBtn">
                    <i class="fa-solid fa-chevron-left"></i> Anterior
                  </button>
                  <button type="button" class="btn-stage-nav" id="slideNextBtn">
                    Siguiente <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
              </div>

              <div class="slide-stage-canvas" id="slideStageCanvas">
                <!-- Populated dynamically -->
              </div>
            </div>
          </div>

          <!-- Tab Panel 5: Recursos Digitales y Práctica Online -->
          <div class="stage-panel" id="stagePanel_resources">
            <div id="resourcesContainer">
              <!-- Populated dynamically -->
            </div>
          </div>

          <!-- Tab Panel 6: Infografía del Día -->
          <div class="stage-panel" id="stagePanel_poster">
            <div class="poster-viewer-card">
              <div
                style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h4 style="font-family: var(--font-heading); font-size: 1.1rem;"><i class="fa-solid fa-image"></i>
                  Infografía Educativa de la Lección</h4>
                <button type="button" class="btn-stage-nav" id="posterFullBtn">
                  <i class="fa-solid fa-expand"></i> Pantalla Completa
                </button>
              </div>
              <div class="poster-media-container" id="posterMediaWrap">
                <!-- Populated dynamically -->
              </div>
            </div>
          </div>

          <!-- Stage Navigation Footer (Prev / Next Buttons) -->
          <div class="stage-nav-footer">
            <button type="button" class="btn-stage-nav" id="prevLessonBtn">
              <i class="fa-solid fa-arrow-left"></i> Lección Anterior
            </button>
            <button type="button" class="btn-stage-nav" id="nextLessonBtn">
              Siguiente Lección <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>

        </div>
      </div>
    </section>
  </template>

  <div id="appRoot"></div>

  <script type="module" src="js/paginas/aula.js"></script>
</body>

</html>
