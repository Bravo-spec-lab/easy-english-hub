<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | EASY English Hub</title>
  <meta name="description"
    content="Plataforma web educativa de Inglés Básico desarrollada por Bravo (Computación e Informática). Aula virtual interactiva con voz nativa en inglés, diapositivas en pantalla, ejercicios, evaluaciones e infografías.">
  <meta name="keywords"
    content="Ingles Basico, Bravo, Computacion e Informatica, EdTech, Aula Virtual, Simple Present, Present Continuous, Simple Past, English LMS">
  <meta name="author" content="Bravo • Computación e Informática">

  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232563eb'/><text x='50' y='65' font-size='50' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'>E</text></svg>">

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Contenido de la vista Dashboard (el layout común lo envuelve js/layout.js) -->
  <template id="pageTemplate">
    <section class="view-section active" id="view_dashboard">
      <div class="dashboard-container">

        <!-- Welcome Hero Banner -->
        <div class="dash-welcome-card" id="dashWelcomeCard">
          <div class="dash-welcome-content">
            <h2>¡Bienvenido a EASY English Hub!</h2>
            <p>Plataforma EdTech interactiva desarrollada por <strong>Bravo</strong> (Computación e Informática). Diseñada para potenciar el aprendizaje del idioma inglés mediante lectura asistida por voz nativa, diapositivas interactivas en pantalla, práctica guiada y evaluaciones en tiempo real.</p>
          </div>
          <div>
            <a class="btn-primary-action" href="aula.html">
              <i class="fa-solid fa-play"></i> <span>Ingresar al Aula Virtual</span>
            </a>
          </div>
        </div>

        <!-- 4 Key Performance Metrics -->
        <div class="dash-stats-grid">
          <div class="stat-widget-card">
            <div class="stat-icon-wrapper stat-icon-blue">
              <i class="fa-solid fa-book-open"></i>
            </div>
            <div class="stat-info-details">
              <h3 id="dashCompletedText">0 / 24</h3>
              <p>Lecciones Completadas</p>
            </div>
          </div>

          <div class="stat-widget-card">
            <div class="stat-icon-wrapper stat-icon-purple">
              <i class="fa-solid fa-award"></i>
            </div>
            <div class="stat-info-details">
              <h3 id="dashQuizzesText">0 / 24</h3>
              <p>Autoevaluaciones Rendidas</p>
            </div>
          </div>

          <div class="stat-widget-card">
            <div class="stat-icon-wrapper stat-icon-green">
              <i class="fa-solid fa-spell-check"></i>
            </div>
            <div class="stat-info-details">
              <h3 id="dashVocabText">168</h3>
              <p>Términos y Verbos</p>
            </div>
          </div>

          <div class="stat-widget-card">
            <div class="stat-icon-wrapper stat-icon-amber">
              <i class="fa-solid fa-fire"></i>
            </div>
            <div class="stat-info-details">
              <h3 id="dashStreakText">Activo</h3>
              <p>Racha de Aprendizaje</p>
            </div>
          </div>
        </div>

        <!-- Primary Continue Card -->
        <div class="dash-welcome-card" id="dashContinueCard"
          style="background: var(--bg-surface); border-color: var(--border-color); box-shadow: var(--shadow-sm);">
          <div>
            <span
              style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--primary-500); letter-spacing: 0.05em;">Lección
              Sugerida</span>
            <h3 id="dashContinueTitle"
              style="font-family: var(--font-heading); font-size: 1.35rem; margin-top: 0.3rem;">Semana 1 • Día 1:
              Welcome & Diagnostic</h3>
            <p id="dashContinueSub" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
              Activación de conocimientos previos y diagnóstico en Simple Present.</p>
          </div>
          <a class="btn-primary-action" id="dashContinueBtn" href="aula.html">
            <i class="fa-solid fa-arrow-right"></i> <span>Continuar Lección</span>
          </a>
        </div>

        <!-- Modules (Semanas) Overview -->
        <div>
          <div class="section-headline">
            <div>
              <h3>Módulos Académicos del Curso</h3>
              <p>3 semanas estructuradas con 6 días de estudio progresivo cada una.</p>
            </div>
          </div>

          <div class="dash-modules-grid" id="dashModulesGrid">
            <!-- Populated dynamically by js/paginas/dashboard.js -->
          </div>
        </div>

        <!-- Personal Brand Footer Badge -->
        <footer class="dash-footer-signature"
          style="margin-top: 36px; padding: 20px 0; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-muted); font-size: 0.85rem;">
          <p style="margin-bottom: 4px;"><strong>EASY English Hub</strong> &copy; 2026 • Desarrollado por
            <strong>Bravo</strong> • Computación e Informática</p>
          <p style="font-size: 0.78rem; opacity: 0.85;">Plataforma Web EdTech para el Aprendizaje Integral de Inglés
            Técnico</p>
        </footer>

      </div>
    </section>
  </template>

  <div id="appRoot"></div>

  <script type="module" src="js/paginas/dashboard.js"></script>
</body>

</html>
