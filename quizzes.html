<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Evaluaciones | EASY English Hub</title>
  <meta name="description"
    content="Centro de evaluaciones del curso de Inglés Básico: monitorea y rinde las 18 autoevaluaciones oficiales con corrección en tiempo real.">
  <meta name="author" content="Bravo • Computación e Informática">

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232563eb'/><text x='50' y='65' font-size='50' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'>E</text></svg>">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <template id="pageTemplate">
    <section class="view-section active" id="view_quizzes">
      <div class="quizzes-hub-container">
        <div class="section-headline">
          <div>
            <h3>Centro de Evaluaciones & Quizzes</h3>
            <p>Monitorea y rinde las 18 autoevaluaciones oficiales del curso con corrección en tiempo real.</p>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="quizzes-filter-bar" id="quizzesFilterBar">
          <button type="button" class="btn-filter-pill active" data-filter="all">Todos los Quizzes (18)</button>
          <button type="button" class="btn-filter-pill" data-filter="1">Semana 1: Simple Present</button>
          <button type="button" class="btn-filter-pill" data-filter="2">Semana 2: Continuous Tenses</button>
          <button type="button" class="btn-filter-pill" data-filter="3">Semana 3: Simple Past</button>
        </div>

        <div class="quizzes-cards-grid" id="quizzesCardsGrid">
          <!-- Populated dynamically by js/paginas/quizzes.js -->
        </div>
      </div>
    </section>
  </template>

  <div id="appRoot"></div>

  <script type="module" src="js/paginas/quizzes.js"></script>
</body>

</html>
